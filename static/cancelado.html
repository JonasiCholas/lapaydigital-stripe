<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamento Cancelado — Lapay Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #7C3AED;
      --brand-light: #A855F7;
      --bg: #0A0A0F;
      --bg-card: #13131A;
      --border: rgba(239,68,68,0.2);
      --text: #F0F0FF;
      --muted: #8B8BA7;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at 50% 0%, rgba(239,68,68,0.1) 0%, transparent 60%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .icon-wrap {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(239,68,68,0.1); border: 2px solid rgba(239,68,68,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin: 0 auto 28px;
      animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    h1 { font-size: 32px; font-weight: 800; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 16px; line-height: 1.6; margin-bottom: 36px; }
    .btn-back {
      display: block;
      background: linear-gradient(135deg, var(--brand), var(--brand-light));
      color: #fff; text-decoration: none;
      padding: 14px 32px; border-radius: 12px;
      font-size: 15px; font-weight: 600;
      transition: all 0.2s; margin-bottom: 12px;
    }
    .btn-back:hover { opacity: 0.9; transform: translateY(-1px); }
    .note { font-size: 13px; color: var(--muted); }
    .note a { color: #A855F7; }
  </style>
</head>
<body>
<div class="container">
  <div class="icon-wrap">❌</div>
  <h1>Pagamento Cancelado</h1>
  <p>Nenhuma cobrança foi realizada.<br />Você pode tentar novamente quando quiser.</p>
  <a href="/" class="btn-back">Voltar para a loja</a>
  <p class="note">Precisa de ajuda? <a href="mailto:contato@lapaydigital.com">contato@lapaydigital.com</a></p>
</div>
</body>
</html>
